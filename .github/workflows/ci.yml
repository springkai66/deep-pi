name: DeepPi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Svelte and TypeScript
        run: pnpm check

      - name: Run web tests
        run: pnpm test:web

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Install ripgrep for content search tests
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust clippy
        run: >-
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
          -- -D warnings

      - name: Audit Rust dependencies
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run Rust dependency audit
        working-directory: src-tauri
        run: cargo audit

      - name: Check dependency licenses
        run: pnpm licenses:check

      - name: Check release configuration
        run: pnpm release:check

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Scan repository for secrets
        shell: pwsh
        run: |
          $version = '8.24.3'
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'gitleaks'
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_windows_x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $directory -Force
          & (Join-Path $directory 'gitleaks.exe') git --redact --no-banner -v .

      - name: Build web assets
        run: pnpm build
