name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run release checks
        run: node scripts/release-check.mjs

      - name: Run tests and build checks
        run: pnpm test

      - name: Require updater signing secrets for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: >-
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DEEPPI_UPDATER_PUBLIC_KEY: ${{ secrets.DEEPPI_UPDATER_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Tagged releases require TAURI_SIGNING_PRIVATE_KEY.'
          }
          if ([string]::IsNullOrWhiteSpace(
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          )) {
            throw 'Tagged releases require TAURI_SIGNING_PRIVATE_KEY_PASSWORD.'
          }
          if ([string]::IsNullOrWhiteSpace($env:DEEPPI_UPDATER_PUBLIC_KEY)) {
            throw 'Tagged releases require DEEPPI_UPDATER_PUBLIC_KEY.'
          }

      - name: Prepare tagged updater configuration
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          DEEPPI_UPDATER_PUBLIC_KEY: ${{ secrets.DEEPPI_UPDATER_PUBLIC_KEY }}
        run: pnpm updater:prepare

      - name: Build unsigned installer bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm tauri build --bundles nsis,msi

      - name: Build signed updater installer bundles
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: >-
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          pnpm tauri build --bundles nsis,msi --config
          src-tauri/tauri.release.generated.conf.json

      - name: Verify produced installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/release-check.mjs --require-installer

      - name: Download previous stable installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'deeppi-previous'
          New-Item -ItemType Directory -Force -Path $previous | Out-Null
          gh release download stable `
            --repo $env:GITHUB_REPOSITORY `
            --pattern '*-setup.exe' `
            --dir $previous
          if ($LASTEXITCODE -ne 0) {
            # 首次发布时上游还没有 stable release。这里必须显式 exit 0：
            # Actions 的 pwsh 包装器会在步骤末尾执行 `exit $LASTEXITCODE`，
            # 只打印一行提示并不能阻止步骤以非零码失败。
            Write-Host 'No previous stable installer; skipping upgrade smoke.'
            exit 0
          }

      - name: Verify installer install, repair, and uninstall
        run: pnpm installer:smoke

      - name: Verify cross-version installer upgrade
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $previous = Get-ChildItem $env:RUNNER_TEMP/deeppi-previous `
            -Filter '*-setup.exe' -File | Select-Object -First 1
          if ($null -eq $previous) {
            Write-Host 'No previous stable installer; skipping upgrade smoke.'
            exit 0
          }
          $current = Get-ChildItem 'src-tauri/target/release/bundle/nsis' `
            -Filter '*-setup.exe' -File | Select-Object -First 1
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File scripts/installer-smoke.ps1 `
            -InstallerPath $current.FullName `
            -PreviousInstallerPath $previous.FullName

      # v1 先发未签名安装包；拿到 Authenticode 证书后把
      # DEEPPI_WINDOWS_CERTIFICATE_BASE64 / _PASSWORD 写入仓库 Secrets 即自动启用签名。
      - name: Detect Authenticode certificate
        if: startsWith(github.ref, 'refs/tags/')
        id: certificate
        shell: pwsh
        env:
          DEEPPI_WINDOWS_CERTIFICATE_BASE64: >-
            ${{ secrets.DEEPPI_WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificate = $env:DEEPPI_WINDOWS_CERTIFICATE_BASE64
          $message = 'No Authenticode certificate configured; skipping signing.'
          if ([string]::IsNullOrWhiteSpace($certificate)) {
            Write-Host $message
            "available=false" >> $env:GITHUB_OUTPUT
          } else {
            "available=true" >> $env:GITHUB_OUTPUT
          }

      - name: Sign tagged release files
        if: >-
          startsWith(github.ref, 'refs/tags/') &&
          steps.certificate.outputs.available == 'true'
        shell: pwsh
        env:
          DEEPPI_WINDOWS_CERTIFICATE_BASE64: >-
            ${{ secrets.DEEPPI_WINDOWS_CERTIFICATE_BASE64 }}
          DEEPPI_WINDOWS_CERTIFICATE_PASSWORD: >-
            ${{ secrets.DEEPPI_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $password = $env:DEEPPI_WINDOWS_CERTIFICATE_PASSWORD
          $missing = [string]::IsNullOrWhiteSpace($password)
          if ($missing) {
            $reason = 'Authenticode certificate is configured'
            throw "$reason without a password secret."
          }
          $certificate = Join-Path $env:RUNNER_TEMP 'deeppi-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String(
              $env:DEEPPI_WINDOWS_CERTIFICATE_BASE64
            )
          )
          $files = Get-ChildItem 'src-tauri/target/release' -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' }
          if ($files.Count -eq 0) { throw 'No Windows binaries were produced.' }
          foreach ($file in $files) {
            $signArguments = @(
              'sign', '/fd', 'SHA256', '/f', $certificate,
              '/p', $env:DEEPPI_WINDOWS_CERTIFICATE_PASSWORD,
              '/tr', 'http://timestamp.digicert.com', '/td', 'SHA256'
            )
            & signtool.exe @signArguments $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $($file.FullName)"
            }
          }

      - name: Sign updater payloads
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: >-
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          $files = Get-ChildItem $bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' }
          foreach ($file in $files) {
            & pnpm tauri signer sign $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Updater signing failed for $($file.FullName)"
            }
          }

      - name: Generate updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          DEEPPI_RELEASE_NOTES: ${{ github.ref_name }}
        run: pnpm updater:manifest

      - name: Verify produced updater artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          node scripts/release-check.mjs --require-installer
          --require-updater

      - name: Verify Authenticode signatures
        if: >-
          startsWith(github.ref, 'refs/tags/') &&
          steps.certificate.outputs.available == 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem 'src-tauri/target/release' -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' }
          foreach ($file in $files) {
            & signtool.exe verify /pa /all $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed for $($file.FullName)"
            }
          }

      - name: Upload unsigned or signed bundles
        uses: actions/upload-artifact@v4
        with:
          name: deeppi-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

      - name: Refuse to overwrite an existing tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release ${{ github.ref_name }} already exists. Versioned releases are immutable: delete the old release deliberately, then re-tag."
          }
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/latest.json
            src-tauri/target/release/bundle/**/latest.json
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
          body_path: RELEASE_NOTES.md

      - name: Sync stable updater channel
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view stable --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create stable `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title 'DeepPi stable updater channel' `
              --notes 'Managed by the Windows Release workflow.' `
              --prerelease
          }
          $nsis = 'src-tauri/target/release/bundle/nsis'
          $assets = @(
            Get-ChildItem $nsis -Filter '*-setup.exe' -File
            Get-ChildItem $nsis -Filter '*-setup.exe.sig' -File
            Get-Item 'src-tauri/target/release/bundle/latest.json'
          )
          gh release upload stable --repo $env:GITHUB_REPOSITORY `
            --clobber @($assets.FullName)
