name: Exit code probe (temporary)

# 临时探针：测量 pwsh 中「原生命令失败但被 if 处理」之后脚本的真实退出码，
# 用于判断 release.yml 首次发布路径（gh release download 失败 → 被 if 处理）
# 是否会失败。结论取得后删除本文件。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Measure exit codes of each pattern
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'exitprobe'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $fail = 'cmd /c exit 3'
          $guard = "if (`$LASTEXITCODE -ne 0) { Write-Host 'handled' }"

          $cases = [ordered]@{}
          $cases['a_ends_with_failing_native'] = "$fail"
          $cases['b_handled_no_reset'] = "$fail`n$guard"
          $cases['c_handled_then_native_ok'] = "$fail`n$guard`ncmd /c exit 0"
          $cases['d_handled_then_exit0'] = "$fail`n$guard`nexit 0"
          $cases['e_handled_then_cmdlet'] = "$fail`n$guard`nWrite-Host 'more'"

          foreach ($name in $cases.Keys) {
            $path = Join-Path $dir "$name.ps1"
            Set-Content -Path $path -Value $cases[$name] -NoNewline
            pwsh -NoProfile -Command ". '$path'" *> $null
            $dotSource = $LASTEXITCODE
            pwsh -NoProfile -File $path *> $null
            $fileForm = $LASTEXITCODE
            $line = "MEASURED {0} dot-source={1} file={2}"
            Write-Host ($line -f $name, $dotSource, $fileForm)
          }

      - name: Probe a failing gh download like the workflow does
        shell: pwsh
        run: |
          gh release download definitely-not-a-real-tag `
            --repo $env:GITHUB_REPOSITORY `
            --pattern '*-setup.exe' `
            --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'No previous stable installer; skipping upgrade smoke.'
          }
          Write-Host "reached end of step; LASTEXITCODE=$LASTEXITCODE"

      - name: Control with the same failure then exit 0
        shell: pwsh
        run: |
          gh release download definitely-not-a-real-tag `
            --repo $env:GITHUB_REPOSITORY `
            --pattern '*-setup.exe' `
            --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'handled'
            exit 0
          }

      - name: Control where gh succeeds then view a missing release
        shell: pwsh
        run: |
          gh release list --repo $env:GITHUB_REPOSITORY *> $null
          gh release view definitely-not-a-real-tag `
            --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'would create the stable release here'
            exit 0
          }
          Write-Host 'unexpected: a fake tag existed'
