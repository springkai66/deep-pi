[package]
name = "deeppi"
version = "1.3.0"
description = "Desktop host for Pi Coding Agent and DeepSeek Harness"
authors = ["DeepPi contributors"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deeppi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
 
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
portable-pty = "0.9.0"
base64 = "0.22.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.0", features = ["v4"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
atomic-write-file = "0.3.1"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
tauri-plugin-dialog = "2"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tempfile = "3.27.0"
notify = "8.2.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# 代理回归测试：直接验证 reqwest→hyper-util 匹配器对环境变量/NO_PROXY 的
# 路由行为（更新器直连路径的证据，依赖树内已编译，无新增构建成本）。
hyper-util = { version = "0.1", default-features = false, features = [
    "client",
    "client-proxy",
    "client-proxy-system",
] }
http = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
